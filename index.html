<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>متابعة تفعيل المنصة الافتراضية | مدارس ابن رشد</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--green:#176b45;--gold:#c69b38;--light:#f3f7f4}
*{box-sizing:border-box}
body{margin:0;background:var(--light);font-family:Tahoma,Arial,sans-serif;color:#24352c}
header{background:linear-gradient(120deg,#105638,#218357);color:white;text-align:center;padding:22px 14px}
header img{width:105px;height:105px;object-fit:contain;background:white;border-radius:15px;padding:6px}
header h1{font-size:23px;margin:12px 0 5px}
header p{margin:4px}
.school{display:block;width:min(94%,760px);max-height:260px;object-fit:cover;margin:18px auto;border-radius:14px}
main{max-width:850px;margin:18px auto;padding:0 12px}
.card{background:white;border-radius:15px;padding:20px;margin:14px 0;box-shadow:0 3px 14px #173c2812}
h2{color:var(--green);font-size:20px;margin-top:0}
label{display:block;font-weight:bold;margin:14px 0 7px}
input,select,textarea{width:100%;padding:12px;border:1px solid #cbd8cf;border-radius:9px;font:inherit;background:white}
textarea{min-height:95px;resize:vertical}
button,.btn{border:0;border-radius:9px;padding:12px 19px;font:inherit;font-weight:bold;cursor:pointer;background:var(--green);color:white}
button:hover,.btn:hover{opacity:.9}
.gold{background:var(--gold);color:#18251d}
.topbar{max-width:850px;margin:14px auto 0;padding:0 12px;display:flex;justify-content:flex-start}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.rating{border:1px solid #e0e9e2;border-radius:10px;padding:12px;margin:10px 0}
.rating strong{display:block;margin-bottom:8px}
.rating label{display:inline-flex;align-items:center;gap:5px;margin:5px 12px 5px 0;font-weight:normal}
.rating input{width:auto}
.hidden{display:none!important}
.notice{padding:12px;border-radius:9px;margin:12px 0;background:#edf7ef}
.error{background:#fff0ef;color:#a22}
footer{text-align:center;padding:20px;color:#68786e;font-size:13px}
small{color:#69766e}
</style>
</head>
<body>
<header>
<img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSuLk5bR1ni6ys-QIgWOQWxMebvicBWO1rJGzfkJuIchNVIpRky3_LkD0o&s=10" alt="شعار مدارس ابن رشد">
<h1>مدارس ابن رشد</h1>
<p>متابعة تفعيل المنصة الافتراضية</p>
</header>

<div class="topbar">
<a class="btn gold" href="reports.html" style="text-decoration:none">أرشيف التقارير</a>
</div>

<img class="school" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTKgiuJxwAraFcx1a1eYQMa5trb_B96hSKz0gPPzPc4Og&s=10" alt="مبنى المدرسة">

<main>
<section class="card" id="gate">
<h2>الدخول إلى نموذج المتابعة</h2>
<label for="gatePassword">كلمة المرور</label>
<input id="gatePassword" type="password" placeholder="أدخل كلمة المرور">
 <div class="actions"> 
  <button type="button" onclick="if(document.getElementById('gatePassword').value.trim()==='54321'){document.getElementById('gate').classList.add('hidden');document.getElementById('reportForm').classList.remove('hidden');window.scrollTo(0,0)}else{document.getElementById('gateMessage').textContent='كلمة المرور غير صحيحة.'}">دخول</button>
</div>
<p id="gateMessage"></p>
</section>

<form id="reportForm" class="hidden">
<section class="card">
<h2>بيانات الزيارة والمتابعة</h2>
<label for="follower">اسم المتابع</label>
<select id="follower" required>
<option value="">اختر اسم المتابع</option>
<option>علي محمد مرعي</option>
<option>علي محمد خثامي</option>
<option>محمد سلمان فقيري</option>
</select>
<label for="teacher">اسم المعلم</label>
<input id="teacher" required placeholder="اسم المعلم">
<label for="grade">الصف</label>
<input id="grade" required placeholder="الصف والفصل">
<label for="period">الحصة</label>
<select id="period" required>
<option value="">اختر الحصة</option>
<option>الأولى</option><option>الثانية</option><option>الثالثة</option>
<option>الرابعة</option><option>الخامسة</option><option>السادسة</option><option>السابعة</option>
</select>
<label for="subject">المادة</label>
<input id="subject" required>
<label for="lesson">عنوان الدرس</label>
<input id="lesson" required>
</section>

<section class="card">
<h2>تقييم تفعيل المنصة الافتراضية</h2>
<div id="ratings"></div>
</section>

<section class="card">
<h2>الملاحظات والمرفقات</h2>
<label for="notes">الملاحظات</label>
<textarea id="notes" placeholder="اكتب الملاحظات هنا..."></textarea>
<label for="evidence">إرفاق صور أو ملفات داعمة</label>
<input id="evidence" type="file" multiple accept="image/*,.pdf,.doc,.docx,.ppt,.pptx,.xls,.xlsx">
<small>يمكن إرفاق صور وملفات PDF وWord وPowerPoint وExcel. الحد الأقصى 12MB لكل ملف.</small>
<div id="fileMessage"></div>
<div class="actions">
<button id="submitButton" type="submit">إرسال التقرير وحفظه</button>
<button type="button" class="gold" onclick="location.reload()">إلغاء والعودة</button>
</div>
<p id="status"></p>
</section>
</form>
</main>
<footer>مدارس ابن رشد — نظام متابعة تفعيل المنصة الافتراضية</footer>

<script>
 const SUPABASE_URL = "https://dsgjmwrlffklrwbylhng.supabase.co";
 const SUPABASE_KEY = "sb_publishable_vyTFz1z43ioVE5VTVJp33g_frdaWD-P";
const TABLE = "virtual_platform_reports";
const BUCKET = "virtual-platform-evidence";
 let db = null;
const criteria = [
"جاهزية المنصة",
"وضوح الصوت",
"وضوح العرض",
"تفاعل المعلم",
"حضور الطلاب",
"مناسبة الواجبات",
"انتظام الحصص",
"استقرار المنصة",
"تفاعل الطلاب",
"الانتظام في الحصة"
];

document.getElementById("ratings").innerHTML = criteria.map((name,i)=>`
<div class="rating">
<strong>${i+1}. ${name}</strong>
${["مرتفعة جداً","مرتفعة","متوسطة","ضعيفة"].map(v=>`
<label><input type="radio" name="rating${i}" value="${v}" required>${v}</label>
`).join("")}
</div>`).join("");
 try {
  if (window.supabase && window.supabase.createClient) {
    db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  }
} catch (error) {
  console.error(error);
}


window.enterForm = function(){
  const pass = document.getElementById("gatePassword").value.trim();

  if(pass === "54321"){
    document.getElementById("gate").classList.add("hidden");
    document.getElementById("reportForm").classList.remove("hidden");
    window.scrollTo({top:0, behavior:"smooth"});
  } else {
    const message = document.getElementById("gateMessage");
    message.textContent = "كلمة المرور غير صحيحة.";
    message.className = "error";
  }
};
document.getElementById("evidence").addEventListener("change",()=>{
 const files=[...document.getElementById("evidence").files];
 const tooLarge=files.find(f=>f.size>12*1024*1024);
 document.getElementById("fileMessage").textContent=tooLarge?
 "الملف "+tooLarge.name+" يتجاوز 12MB. يرجى اختيار ملف أصغر.":files.length+" ملف/ملفات محددة.";
 document.getElementById("fileMessage").className=tooLarge?"error":"notice";
});

document.getElementById("reportForm").addEventListener("submit",async(e)=>{
 e.preventDefault();
 const btn=document.getElementById("submitButton");
 const status=document.getElementById("status");
 const files=[...document.getElementById("evidence").files];

 if(files.some(f=>f.size>12*1024*1024)){
  status.textContent="يوجد ملف يتجاوز الحد الأقصى 12MB.";
  status.className="error";return;
 }

 const ratings={};
 criteria.forEach((name,i)=>{
  const selected=document.querySelector(`input[name="rating${i}"]:checked`);
  if(selected)ratings[name]=selected.value;
 });
 if(Object.keys(ratings).length!==criteria.length){
  status.textContent="يرجى إكمال تقييم المعايير العشرة.";
  status.className="error";return;
 }

 btn.disabled=true;btn.textContent="جارٍ حفظ التقرير...";
 status.textContent="يرجى الانتظار حتى يكتمل رفع الملفات وحفظ التقرير.";
 status.className="notice";

 const uploaded = [];

try {
  for (const file of files) {
    const extMatch = file.name.match(/\.([a-zA-Z0-9]{1,10})$/);
    const safeExt = extMatch ? extMatch[1].toLowerCase() : "bin";

    const path = `${Date.now()}_${Math.random()
      .toString(36)
      .slice(2)}.${safeExt}`;

    const { error: uploadError } = await db.storage
      .from(BUCKET)
      .upload(path, file, { upsert: false });

    if (uploadError) {
      throw new Error(
        "فشل رفع الملف " + file.name + ": " + uploadError.message
      );
    }

    uploaded.push({
      name: file.name,
      path: path,
      type: file.type,
      size: file.size
    });
  }

  const report={
   follower:document.getElementById("follower").value,
   teacher:document.getElementById("teacher").value.trim(),
   grade:document.getElementById("grade").value.trim(),
   period:document.getElementById("period").value,
   subject:document.getElementById("subject").value.trim(),
   lesson:document.getElementById("lesson").value.trim(),
   ratings,
   notes:document.getElementById("notes").value.trim(),
   files:uploaded
  };

  const {error}=await db.from(TABLE).insert([report]);
  if(error)throw new Error("تعذر حفظ التقرير في قاعدة البيانات: "+error.message);

  alert("تم إرسال التقرير وحفظه بنجاح.");
  document.getElementById("reportForm").reset();
  location.href="index.html";
 }catch(err){
  for(const f of uploaded){
   await db.storage.from(BUCKET).remove([f.path]);
  }
  status.textContent=err.message;
  status.className="error";
  btn.disabled=false;btn.textContent="إرسال التقرير وحفظه";
 }
});
</script>
</body>
</html>
